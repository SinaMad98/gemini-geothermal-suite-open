name: Hackathon verify

on:
  push:
    branches: ["verify/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.11"
          - os: ubuntu-latest
            python: "3.12"
          - os: windows-latest
            python: "3.11"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install as the README says
        run: python -m pip install -r hackathon_submission/requirements.txt
      - name: Run verification
        run: python .github/verify/verify_submission.py
      - name: Lint submission
        if: always()
        continue-on-error: true
        run: |
          python -m pip install flake8 black==25.11.0
          python -m flake8 hackathon_submission --max-line-length=100 --count --statistics
          python -m black --check --diff hackathon_submission
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verify-${{ matrix.os }}-py${{ matrix.python }}-attempt${{ github.run_attempt }}
          path: verify_out
